name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q main.py filebutler tests

  build-windows:
    name: Build FileButler.exe
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean FileButler.spec
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/FileButler.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Build output not found: $exe" }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -le 0) { throw "Build output is empty: $exe" }
          Write-Host "Verified $($item.FullName) ($($item.Length) bytes)"
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileButler-windows-x64
          path: dist/FileButler.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: dist/FileButler.exe
